<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 30 570 500" width="570" height="500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gBar" x1="0.8" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#1F7BFF"/>
      <stop offset="1" stop-color="#0B4FF0"/>
    </linearGradient>
    <linearGradient id="gWedge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0A5BFF"/>
      <stop offset="1" stop-color="#18B8FF"/>
    </linearGradient>
    <linearGradient id="gBand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#18B0FF"/>
    </linearGradient>
    <linearGradient id="gDark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0A3FD8"/>
      <stop offset="1" stop-color="#0B63F5"/>
    </linearGradient>
    <linearGradient id="gBlade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#00C8FF"/>
      <stop offset="1" stop-color="#0A55FF"/>
    </linearGradient>
  </defs>

  <g id="4lpha-icon">
